<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ai Đang Điều Khiển Tôi?</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 15% 10%,#6454c9 0,transparent 32rem),linear-gradient(140deg,#17152b,#193d51);overflow-x:hidden}button,input{font:inherit}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:24px 0}.top{display:flex;justify-content:space-between;align-items:center;font-weight:900}.mark{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:14px;background:#c8ff4d;color:#17152b;margin-right:10px}.hero{min-height:85vh;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:50px}h1{font-size:clamp(3.2rem,8vw,7rem);line-height:.86;letter-spacing:-.07em;margin:14px 0}h1 span{color:#c8ff4d}.muted{color:#c4bed8;line-height:1.6}.card{background:#18152fdc;border:1px solid #ffffff22;border-radius:26px;padding:23px;box-shadow:0 25px 70px #0005}.grid{display:grid;gap:12px}input{padding:14px;border-radius:14px;border:1px solid #ffffff22;background:#09081888;color:white}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;background:#c8ff4d;color:#17152b;cursor:pointer}.btn.alt{background:#ffffff16;color:white;border:1px solid #ffffff22}.tabs{display:flex;gap:8px;margin-bottom:16px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.player{padding:13px;border-radius:16px;background:#ffffff0c;border:1px solid #ffffff1f}.code{font-size:clamp(2.6rem,8vw,5rem);letter-spacing:.16em;color:#c8ff4d;font-weight:1000}.hud{position:fixed;inset:0;z-index:4;pointer-events:none;padding:14px}.hudtop{display:flex;justify-content:space-between}.pill{background:#18152fe5;border:1px solid #ffffff24;border-radius:17px;padding:10px 14px;backdrop-filter:blur(15px)}.controls{position:fixed;bottom:16px;left:50%;translate:-50%;display:flex;gap:9px;pointer-events:auto}.control{min-width:74px;min-height:62px;border-radius:18px;border:1px solid #ffffff33;background:#18152fe8;color:white;font-weight:900}.control:active{background:#c8ff4d;color:#17152b}.announce{position:fixed;top:23%;left:50%;translate:-50%;background:#c8ff4d;color:#17152b;padding:12px 20px;border-radius:17px;font-weight:1000}.result{text-align:center;max-width:600px;margin:12vh auto}.result h1{font-size:clamp(3rem,9vw,6rem)}canvas{position:fixed;inset:0;width:100%;height:100%;display:none}body.playing canvas{display:block}.lobby{display:grid;grid-template-columns:1fr 330px;gap:20px;margin-top:45px}@media(max-width:760px){.hero,.lobby{grid-template-columns:1fr}.players{grid-template-columns:1fr}h1{font-size:15vw}}
</style></head><body><canvas id="c"></canvas><main id="app"></main><script>
const app=document.querySelector('#app'),canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');let ws,state,seq=0,session=null,lastAnn='',annUntil=0;const roleActions={move:['left','right'],pace:['accelerate','brake'],jump:['jump'],action:['slide'],camera:['cameraLeft','cameraRight'],throw:['throw'],actionThrow:['slide','throw'],moveCamera:['left','right','cameraLeft','cameraRight']},labels={left:'← Trái',right:'Phải →',accelerate:'⚡ Chạy',brake:'■ Phanh',jump:'↑ Nhảy',slide:'↘ Trượt',cameraLeft:'◀ Cam',cameraRight:'Cam ▶',throw:'◎ Ném'},roleLabel={move:'Di chuyển',pace:'Tăng tốc / phanh',jump:'Nhảy',action:'Trượt',camera:'Camera',throw:'Ném túi',actionThrow:'Trượt + ném',moveCamera:'Di chuyển + camera'};function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error')alert(m.message);if(m.type==='welcome')session=m;if(m.type==='state'){state=m.state;if(state.announcement!==lastAnn){lastAnn=state.announcement;annUntil=performance.now()+1800}render()}};ws.onclose=()=>setTimeout(connect,1000)}
function home(){document.body.classList.remove('playing');app.innerHTML=`<div class="wrap"><div class="top"><div><span class="mark">?</span>AI ĐANG ĐIỀU KHIỂN TÔI?</div><small>4–6 người</small></div><section class="hero"><div><b style="color:#c8ff4d">WEB PARTY GAME</b><h1>Không ai tự điều khiển <span>chính mình.</span></h1><p class="muted">Một người chạy, một người nhảy, một người phanh. Cứ 20 giây toàn bộ quyền bị tráo.</p></div><div class="card"><div class="tabs"><button class="btn" id="newtab">Tạo phòng</button><button class="btn alt" id="jointab">Vào phòng</button></div><form id="form" class="grid"><input name="name" minlength="2" maxlength="16" placeholder="Tên của bạn" required><button class="btn">Tạo phòng</button></form></div></section></div>`;let join=false;function mode(v){join=v;document.querySelector('#form').innerHTML=(join?'<input name="code" maxlength="5" placeholder="Mã phòng" required>':'')+'<input name="name" minlength="2" maxlength="16" placeholder="Tên của bạn" required><button class="btn">'+(join?'Vào phòng':'Tạo phòng')+'</button>'}newtab.onclick=()=>mode(false);jointab.onclick=()=>mode(true);form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);send(join?{type:'join',code:d.get('code'),name:d.get('name')}:{type:'create',name:d.get('name')})}}
function lobby(){document.body.classList.remove('playing');const host=state.hostId===state.viewerId;app.innerHTML=`<div class="wrap"><div class="top"><div><span class="mark">?</span>PHÒNG CHỜ</div><b>${state.players.length}/6</b></div><section class="lobby"><div class="card"><small>MÃ PHÒNG</small><div class="code">${state.code}</div><div class="players">${state.players.map(p=>`<div class="player"><b>${p.name}${p.id===state.hostId?' 👑':''}</b><br><small>${p.bot?'Bot thử nghiệm':p.connected?'Đã kết nối':'Mất kết nối'}</small></div>`).join('')}</div></div><aside class="card"><h2>Chạy Trốn Xe Rác</h2><p class="muted">Cả phòng điều khiển chung một nhân vật. Đến gần xe rồi ném túi rác vào thùng.</p>${host?`<button class="btn alt" id="bot">+ Bot thử</button> <button class="btn" id="start" ${state.players.length<4?'disabled':''}>Bắt đầu</button>`:'<p>Chờ chủ phòng bắt đầu…</p>'}</aside></section></div>`;if(host){bot.onclick=()=>send({type:'add_bot'});start.onclick=()=>send({type:'start'})}}
function game(){document.body.classList.add('playing');const me=state.players.find(p=>p.id===state.viewerId),role=me?.role,actions=roleActions[role]||[],g=state.game;app.innerHTML=`<div class="hud"><div class="hudtop"><div class="pill"><b>${state.phase==='COUNTDOWN'?Math.ceil(state.countdownMs/1000):Math.ceil((g?.remainingMs||120000)/1000)+'s'}</b><br><small>Va chạm ${g?.collisions||0}</small></div><div class="pill"><small>QUYỀN CỦA BẠN</small><br><b style="color:#c8ff4d">${roleLabel[role]||'Đang chia…'}</b></div></div><div class="controls">${actions.map(a=>`<button class="control" data-a="${a}">${labels[a]}</button>`).join('')}</div></div>${performance.now()<annUntil?`<div class="announce">${lastAnn}</div>`:''}`;document.querySelectorAll('[data-a]').forEach(b=>{const a=b.dataset.a;b.onpointerdown=e=>{e.preventDefault();send({type:'input',action:a,pressed:true,sequence:seq++})};b.onpointerup=b.onpointercancel=e=>{e.preventDefault();send({type:'input',action:a,pressed:false,sequence:seq++})}})}
function result(){document.body.classList.remove('playing');const g=state.game,w=g?.reason==='delivered';app.innerHTML=`<section class="card result"><div style="font-size:5rem">${w?'🎉':'🗑️💨'}</div><h1>${w?'Giao được rồi!':'Xe chạy mất!'}</h1><p class="muted">Điểm: ${g?.score||0} · Túi còn ${g?.bagIntegrity||100}%</p><button class="btn" id="again">Chơi lại</button></section>`;again.onclick=()=>send({type:'rematch'})}function render(){if(!state)return home();if(state.phase==='LOBBY')return lobby();if(['COUNTDOWN','PLAYING'].includes(state.phase))return game();result()}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function draw(){requestAnimationFrame(draw);if(!document.body.classList.contains('playing'))return;const w=innerWidth,h=innerHeight,g=state?.game||{x:4,y:0,truckX:42};const road=h*.74,scale=Math.max(9,Math.min(17,w/65)),center=g.x*.7+g.truckX*.3,X=x=>w*.42+(x-center)*scale;let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#6559da');grad.addColorStop(1,'#efc985');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.fillStyle='#57546d';ctx.fillRect(0,road,w,h-road);ctx.strokeStyle='#fff9';ctx.setLineDash([35,25]);ctx.beginPath();ctx.moveTo(0,road+45);ctx.lineTo(w,road+45);ctx.stroke();ctx.setLineDash([]);const tx=X(g.truckX);ctx.fillStyle='#c8ff4d';ctx.fillRect(tx-65,road-80,120,72);ctx.fillStyle='#1e1b37';ctx.fillRect(tx-50,road-65,65,42);ctx.beginPath();ctx.arc(tx-38,road-6,15,0,7);ctx.arc(tx+42,road-6,15,0,7);ctx.fill();const x=X(g.x),y=road-55-g.y*25;ctx.fillStyle='#ff7dbb';ctx.beginPath();ctx.arc(x,y,34,0,7);ctx.fill();ctx.fillStyle='#211d42';ctx.beginPath();ctx.arc(x-10,y-6,4,0,7);ctx.arc(x+10,y-6,4,0,7);ctx.fill();ctx.fillStyle='#ffd34d';ctx.fillRect(x-24,y+26,16,38);ctx.fillRect(x+8,y+26,16,38)}draw();connect();render();
</script></body></html>
