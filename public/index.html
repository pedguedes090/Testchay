<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18152f">
  <title>Ai Đang Điều Khiển Tôi?</title>
  <style>
    :root{font-family:Inter,ui-rounded,"Segoe UI",system-ui,sans-serif;color:#fff;background:#151329;--lime:#c8ff4d;--pink:#ff77b7;--panel:#18152fe8;--muted:#c7c1d9;--line:#ffffff22}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 8%,#6e59d8 0,transparent 32rem),radial-gradient(circle at 90% 90%,#126373 0,transparent 38rem),linear-gradient(145deg,#17152b,#172d3e);overflow-x:hidden}button,input{font:inherit}button{touch-action:none}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:22px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:950}.brand{display:flex;align-items:center}.mark{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:15px;background:var(--lime);color:#17152b;margin-right:10px;box-shadow:0 10px 26px #c8ff4d33}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem}.dot{width:9px;height:9px;border-radius:50%;background:#ffcf5a}.dot.online{background:var(--lime);box-shadow:0 0 12px #c8ff4d}.hero{min-height:84dvh;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:55px}.eyebrow{color:var(--lime);font-weight:950;letter-spacing:.12em}h1{font-size:clamp(3.4rem,8vw,7.2rem);line-height:.84;letter-spacing:-.075em;margin:16px 0}h1 span{color:var(--lime)}h2{margin-top:0}.muted{color:var(--muted);line-height:1.58}.card{background:var(--panel);border:1px solid var(--line);border-radius:27px;padding:23px;box-shadow:0 25px 70px #0005;backdrop-filter:blur(18px)}.grid{display:grid;gap:12px}input{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:#09081888;color:#fff;outline:none}input:focus{border-color:var(--lime);box-shadow:0 0 0 3px #c8ff4d20}.btn{border:0;border-radius:14px;padding:13px 17px;font-weight:950;background:var(--lime);color:#17152b;cursor:pointer;transition:.16s transform,.16s filter}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}.btn.alt{background:#ffffff12;color:#fff;border:1px solid var(--line)}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs .active{background:var(--lime);color:#17152b}.lobby{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:45px}.room-head{display:flex;justify-content:space-between;gap:16px}.code{font-size:clamp(2.8rem,8vw,5.2rem);letter-spacing:.16em;color:var(--lime);font-weight:1000;line-height:1.1}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}.player{padding:13px;border-radius:16px;background:#ffffff0c;border:1px solid #ffffff1f}.player.offline{opacity:.55}.player small{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:9px}.tip{padding:12px;border-radius:15px;background:#ffffff0a;color:var(--muted);font-size:.9rem}.hud{position:fixed;inset:0;z-index:4;pointer-events:none;padding:14px env(safe-area-inset-right) calc(14px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}.hudtop{display:flex;justify-content:space-between;gap:10px}.pill{background:#18152fee;border:1px solid #ffffff24;border-radius:18px;padding:10px 14px;backdrop-filter:blur(15px);box-shadow:0 14px 30px #0003}.pill strong{color:var(--lime)}.meters{display:flex;gap:7px;margin-top:7px}.meter{height:7px;width:105px;background:#ffffff18;border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;background:var(--lime);transition:width .2s}.controls{position:fixed;z-index:8;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;translate:-50%;display:flex;gap:9px;pointer-events:auto;max-width:calc(100vw - 20px)}.control{min-width:78px;min-height:64px;border-radius:19px;border:1px solid #ffffff33;background:#18152ff0;color:white;font-weight:950;box-shadow:0 12px 30px #0004;user-select:none;-webkit-user-select:none}.control.active,.control:active{background:var(--lime);color:#17152b;transform:translateY(2px)}.key{display:block;font-size:.68rem;color:#aaa3bd;margin-top:3px}.control.active .key{color:#3f4926}.toast{position:fixed;z-index:12;top:20%;left:50%;translate:-50%;background:var(--lime);color:#17152b;padding:12px 20px;border-radius:17px;font-weight:1000;box-shadow:0 16px 50px #0005;animation:pop .18s ease-out}.toast.error{background:#ff718f;color:#fff}.connection{position:fixed;z-index:15;inset:0;display:none;place-items:center;background:#121023b8;backdrop-filter:blur(8px)}.connection.show{display:grid}.connection .card{text-align:center;max-width:360px}.spinner{width:42px;height:42px;margin:0 auto 15px;border:4px solid #ffffff25;border-top-color:var(--lime);border-radius:50%;animation:spin .8s linear infinite}.result-page #app{min-height:100dvh;display:grid;place-items:center;padding:16px}.result{text-align:center;max-width:640px;width:100%;margin:0}.result h1{font-size:clamp(3rem,9vw,6rem)}.score{font-size:2.2rem;color:var(--lime);font-weight:1000}canvas{position:fixed;inset:0;width:100%;height:100%;display:none}body.playing canvas{display:block}body.playing #app{position:relative;z-index:5}.legend{position:fixed;right:14px;bottom:96px;z-index:5;background:#18152fcf;border:1px solid var(--line);padding:9px 12px;border-radius:14px;color:var(--muted);font-size:.78rem;pointer-events:none}
    @keyframes spin{to{rotate:360deg}}@keyframes pop{from{scale:.85;opacity:0}}@media(max-width:760px){.hero,.lobby{grid-template-columns:1fr}.hero{padding:45px 0}.players{grid-template-columns:1fr}h1{font-size:15vw}.controls{width:100%;justify-content:center}.control{min-width:68px;min-height:60px;font-size:.82rem}.legend{display:none}.room-head{display:block}.hudtop{align-items:flex-start}.pill{font-size:.82rem}.meter{width:78px}}
    @media(orientation:landscape) and (max-height:520px){.hud{padding-top:8px}.controls{bottom:8px}.control{min-height:52px}.pill{padding:7px 11px}.toast{top:13%}.result-page .result{margin:0;padding:12px 20px}.result>div:first-child{font-size:2.6rem!important;line-height:1}.result h1{font-size:clamp(2.3rem,11vh,3.3rem);margin:7px 0}.result .score{font-size:1.75rem}.result p{margin:8px 0}.result .btn{padding:9px 16px}}
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="Màn chơi Chạy Trốn Xe Rác"></canvas>
  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>
  <div id="connection" class="connection show"><div class="card"><div class="spinner"></div><b>Đang kết nối máy chủ…</b></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
